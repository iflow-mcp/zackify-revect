name: Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: mkdir -p ./data && bun test

      - name: Check TypeScript
        run: bun run --bun tsc --noEmit

  docker-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: revect-test:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create test data directory
        run: mkdir -p ./test-data

      - name: Test migrations
        run: |
          echo "Testing database migrations..."
          docker run --rm \
            -v $(pwd)/test-data:/app/data \
            -e DATABASE_PATH=/app/data/test.db \
            revect-test:pr \
            sh -c "mkdir -p /app/data && bun run /app/src/database/migrations.ts up"

      - name: Verify database was created
        run: |
          if [ ! -f "./test-data/test.db" ]; then
            echo "❌ Database file was not created"
            exit 1
          fi
          echo "✅ Database file created successfully"

      - name: Test application startup
        run: |
          echo "Testing application startup..."
          docker run -d --name revect-test \
            -v $(pwd)/test-data:/app/data \
            -e DATABASE_PATH=/app/data/test.db \
            -e AI_API_KEY=test-key \
            -e AI_EMBEDDING_MODEL=test-model \
            -p 3000:3000 \
            revect-test:pr \
            sh -c "mkdir -p /app/data && bun run start"

          sleep 10

          if ! docker ps | grep revect-test; then
            echo "❌ Container failed to start"
            docker logs revect-test
            exit 1
          fi

          echo "✅ Application started successfully"

      - name: Run tests in container
        run: |
          echo "Running tests in container..."
          docker run --rm \
            -v $(pwd)/test-data:/app/data \
            -e DATABASE_PATH=/app/data/test.db \
            -e AI_API_KEY=test-key \
            -e AI_EMBEDDING_MODEL=test-model \
            revect-test:pr \
            sh -c "mkdir -p /app/data && bun test"

      - name: Cleanup
        if: always()
        run: |
          docker stop revect-test 2>/dev/null || true
          docker rm revect-test 2>/dev/null || true
          rm -rf ./test-data
