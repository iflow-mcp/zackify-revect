apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: revect
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/container-dependencies: '{"revect":["ollama-sidecar"]}'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: revect
          image: docker.io/zachrebuild/revect.io:latest
          ports:
            - name: http1
              containerPort: 3000
          env:
            - name: AI_BASE_URL
              value: http://localhost:11434
            - name: AI_API_KEY
              value: "ollama"
            - name: AI_EMBEDDING_MODEL
              value: "mxbai-embed-large"
            - name: AI_EMBEDDING_SIZE
              value: "1024"
          resources:
            limits:
              memory: 1Gi
              cpu: 2000m
          startupProbe:
            timeoutSeconds: 240
            periodSeconds: 240
            failureThreshold: 1
            tcpSocket:
              port: 8080
        - name: ollama-sidecar
          image: docker.io/zachrebuild/revect-ollama:latest
          resources:
            limits:
              cpu: "6"
              nvidia.com/gpu: "1"
              memory: 16Gi
          startupProbe:
            timeoutSeconds: 1
            periodSeconds: 10
            failureThreshold: 3
            tcpSocket:
              port: 11434
      nodeSelector:
        run.googleapis.com/accelerator: nvidia-l4
